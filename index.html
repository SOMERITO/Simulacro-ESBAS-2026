<!DOCTYPE html>
<html lang="es">
<head>
    <!-- VERSIÓN: V5 (Unificada) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESBAS - Sistema de Evaluación V5</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-orange: #f97316; 
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(226, 232, 240, 0.9);
            --success: #10b981;
            --error: #ef4444;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-nav: rgba(220, 38, 38, 0.95);
            --glass-blur: blur(16px);
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at top right, rgba(220, 38, 38, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(220, 38, 38, 0.05) 0%, transparent 40%);
            color: var(--text-dark); min-height: 100vh; background-attachment: fixed;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        /* TOAST NOTIFICATIONS */
        #toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast {
            background: white; border-left: 4px solid var(--primary-red); color: var(--text-dark);
            padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 0.75rem;
            animation: slideInRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards, fadeOut 0.3s ease 3.7s forwards;
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        /* NAVEGACION */
        nav {
            display: none; 
            background: var(--glass-nav); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            padding: 1rem 2rem; justify-content: space-between; align-items: center;
            color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .nav-brand { display: flex; align-items: center; gap: 1.5rem; }
        .brand-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
        .cloud-status { font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 999px; background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; gap: 0.4rem; transition: all 0.3s ease; }
        .cloud-status.syncing { background: #f59e0b; color: white; }
        .cloud-status.success { background: var(--success); color: white; }
        .cloud-status.error { background: var(--error); color: white; }

        .nav-links button { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 0.5rem 1rem; margin-left: 0.5rem; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .nav-links button.active, .nav-links button:hover { background: white; color: var(--primary-red); border-color: white; transform: translateY(-2px); }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; display: none; }
        .view-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* PANTALLA DE LOGIN */
        #login-wrapper {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: var(--bg-main); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
        }
        .login-box {
            background: white; padding: 3rem; border-radius: 16px; box-shadow: var(--shadow-card);
            width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border-color);
        }
        .login-box h1 { color: var(--primary-red); margin-bottom: 0.5rem; font-size: 1.8rem; }
        .login-box p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
        .login-form-group { margin-bottom: 1.5rem; text-align: left; }
        .login-form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-dark); font-size: 0.9rem;}
        .login-form-group input { width: 100%; padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; outline: none; font-size: 1rem; transition: border-color 0.2s;}
        .login-form-group input:focus { border-color: var(--primary-red); box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
        .btn-login { width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 1rem; }

        /* Tarjetas Base */
        .card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-card); position: relative; }
        .card-header { border-bottom: 2px solid var(--primary-red); padding-bottom: 0.5rem; margin-bottom: 1rem; font-weight: 600; color: var(--primary-red); font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center;}
        .global-counter { background: #f1f5f9; color: var(--text-muted); font-size: 0.85rem; padding: 0.3rem 0.8rem; border-radius: 999px; font-weight: 600; border: 1px solid var(--border-color); }

        /* Flashcards Repositorio */
        .flashcard-wrapper { perspective: 1000px; margin-bottom: 1.5rem; cursor: pointer; border-radius: 16px; animation: slideUpFade 0.4s ease forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        .flashcard { display: grid; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; border-radius: 16px; box-shadow: var(--shadow-card); }
        .flashcard-wrapper.flipped .flashcard { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { grid-area: 1 / 1 / 2 / 2; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--glass-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; display: flex; flex-direction: column; justify-content: center; }
        .flashcard-front { position: relative; }
        .flashcard-back { transform: rotateY(180deg); background: rgba(220, 38, 38, 0.03); border: 2px solid rgba(220, 38, 38, 0.2); text-align: center; align-items: center; }
        .q-number-badge { position: absolute; top: 1.5rem; left: 1.5rem; background: rgba(220,38,38,0.1); color: var(--primary-red); font-weight: 700; font-size: 0.85rem; padding: 0.3rem 0.6rem; border-radius: 6px; letter-spacing: 0.5px; }
        .flip-hint { margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted); text-align: center; font-weight: 500; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }

        /* Filtros */
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; width: 100%; }
        .filter-btn { background: white; border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 999px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; }
        .filter-btn.active { background: var(--primary-red); color: white; border-color: var(--primary-red); }
        .badge-count { background: #e2e8f0; color: var(--text-dark); font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 999px; font-weight: 700; }
        .filter-btn.active .badge-count { background: rgba(255,255,255,0.25); color: white; }
        .lesson-filters { display: none; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border-color); justify-content: center; }
        .lesson-filters.active { display: flex; animation: fadeIn 0.3s; }
        .lesson-btn { background: rgba(226, 232, 240, 0.5); border: 1px solid transparent; padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.85rem; font-weight: 500; color: var(--text-dark); display: flex; align-items: center; gap: 0.3rem;}
        .lesson-btn.active { background: rgba(220, 38, 38, 0.15); color: var(--primary-red); border-color: rgba(220, 38, 38, 0.3); font-weight: 600; }
        .lesson-btn.active .badge-count { background: var(--primary-red); color: white; }

        /* Botones Generales */
        button { cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); outline: none; }
        button:active { transform: scale(0.95) !important; }
        .btn { background-color: var(--primary-red); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center;}
        .btn:hover { background-color: var(--primary-red-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(220,38,38,0.3); }
        .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
        .btn-outline:hover { background: #f1f5f9; color: var(--text-dark); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-card-edit { position: absolute; top: 1.5rem; right: 1.5rem; background: rgba(220, 38, 38, 0.05); color: var(--primary-red); border: 1px solid rgba(220, 38, 38, 0.2); padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; z-index: 10; }
        .btn-card-edit:hover { background: var(--primary-red); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3); }
        .action-btn { padding: 0.4rem 0.6rem; margin-right: 0.25rem; font-size: 0.8rem; border: none; border-radius: 6px; font-weight: 600; }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-delete { background: var(--error); color: white; }

        .meta-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; margin-top: 2rem; font-size: 0.8rem; }
        .tag { background: #fee2e2; color: var(--primary-red); padding: 0.25rem 0.75rem; border-radius: 999px; font-weight: 600; }
        .tag-lesson { background: #e2e8f0; color: var(--text-dark); }
        .options-list { list-style: none; margin-top: 1rem; }

        /* Opciones Simulador */
        .option-item { padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; background: white; }
        .option-item:hover { border-color: var(--primary-orange); background: #fff7ed; }
        .option-item.selected { border-color: var(--primary-orange); background: #fff7ed; font-weight: 500; }
        .option-item.selected strong { color: var(--primary-orange) !important; }

        /* Simulación UI */
        .sim-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: var(--glass-bg); padding: 1rem; border-radius: 12px; box-shadow: var(--shadow-card); border: 1px solid var(--border-color); }
        .sim-card { display: none; animation: fadeIn 0.3s ease; }
        .sim-card.active { display: block; }
        .sim-nav-footer { display: flex; justify-content: space-between; margin-top: 1.5rem; }

        /* Dashboard de Resultados */
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .metric-card { background: white; border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 12px; text-align: center; box-shadow: var(--shadow-card); }
        .metric-value { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .metric-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .m-precision { color: #3b82f6; } .m-correct { color: var(--success); } .m-error { color: var(--error); } .m-blank { color: #f59e0b; }

        .detailed-review { display: flex; flex-direction: column; gap: 1rem; text-align: left;}
        .review-item { padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color); background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .review-item.is-correct { border-left: 5px solid var(--success); }
        .review-item.is-incorrect { border-left: 5px solid var(--error); }
        .review-item.is-blank { border-left: 5px solid #f59e0b; }
        .r-question { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-dark); }
        .r-ans { margin-bottom: 0.5rem; padding: 0.75rem; border-radius: 8px; font-size: 0.95rem; }
        .r-ans.user-wrong { background: #fee2e2; color: #991b1b; border: 1px dashed var(--error); }
        .r-ans.user-right { background: #d1fae5; color: #065f46; border: 1px dashed var(--success); }
        .r-ans.actual-correct { background: #f8fafc; color: var(--success); font-weight: 600; border: 1px solid #e2e8f0;}

        /* Tabla CRUD */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 0.85rem; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        th { background: #f8fafc; font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }

        /* MODAL WIZARD */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 1rem; animation: fadeIn 0.2s ease-out; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; border-radius: 16px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; }
        .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; background: transparent; border: none; font-size: 1.5rem; color: var(--text-muted); }
        .modal-close:hover { color: var(--error); transform: scale(1.1) rotate(90deg); }
        .form-step { display: none; animation: fadeIn 0.3s; }
        .form-step.active { display: block; }
        .wizard-progress { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        .wizard-dot { height: 6px; flex: 1; background: #e2e8f0; border-radius: 999px; transition: background 0.3s; }
        .wizard-dot.active { background: var(--primary-red); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-weight: 600; font-size: 0.9rem; color: var(--text-dark); }
        input[type="text"], input[type="number"], select, textarea, input[type="password"] { width: 100%; padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); background: #f8fafc; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-red); background: white; box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1); }

        .alts-vertical { display: flex; flex-direction: column; gap: 0.75rem; background: rgba(241, 245, 249, 0.5); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color); }
        .alt-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; background: white; cursor: pointer; transition: all 0.2s; }
        .alt-row:hover { border-color: rgba(220, 38, 38, 0.4); transform: translateX(4px); }
        .alt-row:has(input:checked) { border-color: var(--success); background: rgba(16, 185, 129, 0.05); transform: translateX(8px); box-shadow: -4px 0 0 var(--success);}
        .alt-row input[type="radio"] { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: var(--success); margin: 0; flex-shrink: 0; }
        .alt-label { font-weight: 700; color: var(--text-muted); width: 1.5rem; font-size: 1.1rem; text-align: center; }
        .alt-row:has(input:checked) .alt-label { color: var(--success); }
        .alt-row input[type="text"] { border: none; background: transparent; padding: 0; box-shadow: none !important; width: 100%;}
        .alt-row input[type="text"]:focus { border: none; background: transparent; }
        .wizard-footer { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 1rem; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state text { display: block; font-size: 3rem; margin-bottom: 1rem;}

        /* Ocultar elementos para usuarios estandar */
        body:not(.role-admin) .admin-only { display: none !important; }

        @media (max-width: 768px) { .metrics-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } .metrics-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="login-wrapper">
    <div class="login-box">
        <h1>🚒 ESBAS 2026</h1>
        <p>Sistema de Entrenamiento y Evaluación</p>
        <form onsubmit="handleLogin(event)">
            <div class="login-form-group">
                <label>Usuario</label>
                <input type="text" id="login-user" placeholder="Ej: JCARRANZA" required autocomplete="off">
            </div>
            <div class="login-form-group">
                <label>Contraseña</label>
                <input type="password" id="login-pass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login">Ingresar al Sistema</button>
        </form>
    </div>
</div>

<nav id="main-nav">
    <div class="nav-brand">
        <div class="brand-title">🚒 ESBAS 2026</div>
        <div id="cloud-indicator" class="cloud-status success admin-only">☁️ Sincronizado</div>
    </div>
    <div class="nav-links">
        <button onclick="switchView('repo')" id="btn-repo" class="active">Repositorio</button>
        <button onclick="switchView('sim')" id="btn-sim">Simulación</button>
        <button onclick="switchView('config')" id="btn-config" class="admin-only">Base de Datos</button>
        <button onclick="switchView('users')" id="btn-users" class="admin-only" style="border-color: #f59e0b; color: #f59e0b;">Usuarios</button>
        <button onclick="logout()" style="border-color: rgba(255,255
