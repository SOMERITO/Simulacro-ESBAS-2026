<!DOCTYPE html>
<html lang="es">
<head>
    <!-- VERSIÓN: V11 (Fix Red QUIC + Animaciones Minimalistas tipo Apple) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESBAS - Sistema de Evaluación</title>
    <style>
        :root {
            --bg-main: #f5f5f7; /* Tono Apple gris ultra claro */
            --primary-red: #d93025;
            --primary-red-hover: #b3261e;
            --primary-orange: #f97316; 
            --text-dark: #1d1d1f;
            --text-muted: #86868b;
            --border-color: rgba(0, 0, 0, 0.08);
            --success: #34c759; /* Verde estilo iOS */
            --error: #ff3b30; /* Rojo estilo iOS */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-nav: rgba(217, 48, 37, 0.95);
            --glass-blur: blur(20px);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); /* Curva Apple */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark); min-height: 100vh; background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        /* ================= ANIMACIONES FLUIDAS ================= */
        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        @keyframes fadeInScale { 
            0% { opacity: 0; transform: scale(0.98); } 
            100% { opacity: 1; transform: scale(1); } 
        }
        @keyframes modalPop { 
            0% { opacity: 0; transform: scale(0.95); } 
            100% { opacity: 1; transform: scale(1); } 
        }

        /* TOAST NOTIFICATIONS */
        #toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary-red); color: var(--text-dark);
            padding: 1rem 1.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 0.75rem;
            animation: slideUpFade 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards, fadeOut 0.4s ease 3.6s forwards;
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }

        /* NAVEGACION */
        nav {
            display: none; 
            background: var(--glass-nav); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            padding: 0.8rem 2rem; justify-content: space-between; align-items: center;
            color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 0 rgba(0,0,0,0.1);
            animation: slideUpFade 0.5s ease-out forwards;
        }
        .nav-brand { display: flex; align-items: center; gap: 1.5rem; }
        .brand-title { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.3px; }
        .cloud-status { 
            font-size: 0.75rem; font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 999px; 
            background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; gap: 0.4rem; 
            transition: var(--transition-smooth);
        }
        .cloud-status.syncing { background: #f59e0b; color: white; }
        .cloud-status.success { background: var(--success); color: white; } /* Bucle infinito removido */
        .cloud-status.error { background: var(--error); color: white; }

        .nav-links button { 
            background: transparent; border: 1px solid transparent; color: rgba(255,255,255,0.8); 
            padding: 0.5rem 1rem; margin-left: 0.2rem; border-radius: 8px; cursor: pointer; 
            font-weight: 500; font-size: 0.9rem; transition: var(--transition-smooth); 
        }
        .nav-links button.active, .nav-links button:hover { 
            background: rgba(255,255,255,0.15); color: white; 
        }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; display: none; }
        .view-section { display: none; animation: fadeInScale 0.4s ease-out; }
        .view-section.active { display: block; }

        /* PANTALLA DE LOGIN */
        #login-wrapper {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: var(--bg-main); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
        }
        .login-box {
            background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.05);
            width: 100%; max-width: 380px; text-align: center; border: 1px solid var(--border-color);
            animation: slideUpFade 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transition: var(--transition-smooth);
        }
        .login-box h1 { color: var(--primary-red); margin-bottom: 2rem; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.5px;}
        .login-form-group { margin-bottom: 1.5rem; text-align: left; }
        .login-form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem;}
        .login-form-group input { 
            width: 100%; padding: 0.9rem; border: 1px solid var(--border-color); border-radius: 12px; 
            outline: none; font-size: 1rem; transition: var(--transition-smooth); background: #fbfbfd;
        }
        .login-form-group input:focus { border-color: var(--primary-red); background: white; box-shadow: 0 0 0 3px rgba(217,48,37,0.15); }
        
        .password-container { position: relative; display: flex; align-items: center; }
        .password-container input { width: 100%; padding-right: 3rem; }
        .password-toggle { 
            position: absolute; right: 10px; background: transparent; border: none;
            cursor: pointer; font-size: 1.2rem; color: var(--text-muted); padding: 0.2rem; outline: none;
            transition: var(--transition-smooth);
        }
        .password-toggle:hover { opacity: 0.7; }

        .btn-login { width: 100%; padding: 0.9rem; font-size: 1rem; margin-top: 0.5rem; border-radius: 12px; }

        /* Tarjetas Base */
        .card { 
            background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--border-color); 
            border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-card); 
            position: relative; transition: var(--transition-smooth);
        }
        .card-header { border-bottom: 1px solid var(--border-color); padding-bottom: 0.8rem; margin-bottom: 1.2rem; font-weight: 600; color: var(--text-dark); font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center;}
        .global-counter { background: #f5f5f7; color: var(--text-muted); font-size: 0.8rem; padding: 0.3rem 0.8rem; border-radius: 999px; font-weight: 500; border: 1px solid var(--border-color); }

        /* Flashcards Repositorio */
        .flashcard-wrapper { 
            perspective: 1000px; margin-bottom: 1.2rem; cursor: pointer; border-radius: 16px; 
            animation: slideUpFade 0.5s ease-out forwards; opacity: 0; 
        }
        .flashcard { 
            display: grid; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); 
            transform-style: preserve-3d; border-radius: 16px; box-shadow: var(--shadow-card); 
        }
        .flashcard-wrapper:hover .flashcard { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .flashcard-wrapper.flipped .flashcard { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { grid-area: 1 / 1 / 2 / 2; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: white; border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; display: flex; flex-direction: column; justify-content: center; }
        .flashcard-front { position: relative; }
        .flashcard-back { transform: rotateY(180deg); background: #fbfbfd; border: 1px solid rgba(0,0,0,0.05); text-align: center; align-items: center; }
        .q-number-badge { position: absolute; top: 1.5rem; left: 1.5rem; background: #f5f5f7; color: var(--text-muted); font-weight: 600; font-size: 0.8rem; padding: 0.3rem 0.6rem; border-radius: 8px; }
        .flip-hint { margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center; display: flex; justify-content: center; align-items: center; gap: 0.5rem; opacity: 0; transition: var(--transition-smooth);}
        .flashcard-wrapper:hover .flip-hint { opacity: 1; }

        /* Filtros */
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; width: 100%; }
        .filter-btn { background: white; border: 1px solid var(--border-color); padding: 0.5rem 1.2rem; border-radius: 999px; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; transition: var(--transition-smooth); }
        .filter-btn:hover { background: #f5f5f7; }
        .filter-btn.active { background: var(--text-dark); color: white; border-color: var(--text-dark); box-shadow: 0 4px 10px rgba(0,0,0,0.15);}
        .badge-count { background: #e5e5ea; color: var(--text-dark); font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 999px; font-weight: 600; transition: var(--transition-smooth); }
        .filter-btn.active .badge-count { background: rgba(255,255,255,0.2); color: white; }
        
        .lesson-filters { display: none; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); justify-content: center; }
        .lesson-filters.active { display: flex; animation: fadeInScale 0.4s; }
        .lesson-btn { background: transparent; border: 1px solid var(--border-color); padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem; transition: var(--transition-smooth);}
        .lesson-btn:hover { background: #f5f5f7; }
        .lesson-btn.active { background: #e5e5ea; color: var(--text-dark); border-color: #d1d1d6; font-weight: 600; }
        .lesson-btn.active .badge-count { background: var(--text-dark); color: white; }

        /* Botones Generales */
        button { cursor: pointer; outline: none; }
        button:active { transform: scale(0.97) !important; }
        .btn { background-color: var(--primary-red); color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 10px; font-weight: 500; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; transition: var(--transition-smooth); font-size: 0.95rem;}
        .btn:hover { background-color: var(--primary-red-hover); box-shadow: 0 4px 12px rgba(217,48,37,0.2); }
        .btn-outline { background: transparent; color: var(--text-dark); border: 1px solid var(--border-color); }
        .btn-outline:hover { background: #f5f5f7; }
        
        .btn-card-edit { position: absolute; top: 1.2rem; right: 1.2rem; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 0.3rem 0.6rem; border-radius: 8px; font-size: 0.8rem; font-weight: 500; z-index: 10; transition: var(--transition-smooth);}
        .btn-card-edit:hover { background: var(--text-dark); color: white; border-color: var(--text-dark); }
        
        .action-btn { padding: 0.3rem 0.6rem; margin-right: 0.25rem; font-size: 0.8rem; border: none; border-radius: 6px; font-weight: 500; transition: var(--transition-smooth); }
        .action-btn:hover { opacity: 0.8; }
        .btn-edit { background: #f5f5f7; color: var(--text-dark); border: 1px solid var(--border-color); }
        .btn-delete { background: #fee2e2; color: var(--error); border: 1px solid rgba(255,59,48,0.2); }

        .meta-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; margin-top: 2rem; font-size: 0.75rem; }
        .tag { background: #f5f5f7; color: var(--text-muted); padding: 0.2rem 0.6rem; border-radius: 6px; font-weight: 500; border: 1px solid var(--border-color); }

        /* Opciones Simulador */
        .options-list { list-style: none; margin-top: 1rem; }
        .option-item { padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 0.5rem; cursor: pointer; transition: var(--transition-smooth); display: flex; align-items: center; background: white; }
        .option-item:hover { border-color: var(--text-dark); }
        .option-item.selected { border-color: var(--primary-red); background: rgba(217,48,37,0.02); font-weight: 500; box-shadow: 0 0 0 1px var(--primary-red); }
        .option-item.selected strong { color: var(--primary-red) !important; }

        /* Simulación UI */
        .sim-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: white; padding: 1rem 1.5rem; border-radius: 16px; box-shadow: var(--shadow-card); border: 1px solid var(--border-color); transition: var(--transition-smooth);}
        .sim-card { display: none; animation: slideUpFade 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .sim-card.active { display: block; }
        .sim-nav-footer { display: flex; justify-content: space-between; margin-top: 1.5rem; }

        /* Dashboard de Resultados */
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .metric-card { background: white; border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 16px; text-align: center; box-shadow: var(--shadow-card); transition: var(--transition-smooth); animation: fadeInScale 0.5s ease-out backwards;}
        .metric-card:nth-child(1) { animation-delay: 0.05s; } .metric-card:nth-child(2) { animation-delay: 0.1s; }
        .metric-card:nth-child(3) { animation-delay: 0.15s; } .metric-card:nth-child(4) { animation-delay: 0.2s; }
        
        .metric-value { font-size: 2.2rem; font-weight: 600; margin-bottom: 0.2rem; }
        .metric-label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
        .m-precision { color: #007aff; } .m-correct { color: var(--success); } .m-error { color: var(--error); } .m-blank { color: #ff9500; }

        .detailed-review { display: flex; flex-direction: column; gap: 1rem; text-align: left;}
        .review-item { padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border-color); background: white; transition: var(--transition-smooth);}
        .review-item.is-correct { border-left: 4px solid var(--success); }
        .review-item.is-incorrect { border-left: 4px solid var(--error); }
        .review-item.is-blank { border-left: 4px solid #ff9500; }
        .r-question { font-size: 1.05rem; font-weight: 500; margin-bottom: 1rem; color: var(--text-dark); line-height: 1.4;}
        .r-ans { margin-bottom: 0.5rem; padding: 0.8rem; border-radius: 10px; font-size: 0.9rem; transition: var(--transition-smooth); }
        .r-ans.user-wrong { background: #fff2f2; color: #cc2222; }
        .r-ans.user-right { background: #f0fff4; color: #1e7e34; }
        .r-ans.actual-correct { background: #f8fafc; color: var(--text-dark); border: 1px solid var(--border-color);}

        /* Tabla CRUD */
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; transition: background 0.2s;}
        tr:hover td { background: #fbfbfd; }
        th { background: #f8fafc; font-weight: 500; color: var(--text-muted); font-size: 0.8rem; border-bottom: 1px solid var(--border-color); }

        /* MODAL WIZARD */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 1rem; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: white; border-radius: 20px; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); position: relative; animation: modalPop 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; background: #f5f5f7; border: none; font-size: 1.2rem; width: 32px; height: 32px; border-radius: 50%; color: var(--text-muted); display: flex; justify-content: center; align-items: center; transition: var(--transition-smooth);}
        .modal-close:hover { background: #e5e5ea; color: var(--text-dark); }
        .form-step { display: none; animation: slideUpFade 0.4s ease-out forwards; }
        .form-step.active { display: block; }
        .wizard-progress { display: flex; gap: 0.4rem; margin-bottom: 2rem; }
        .wizard-dot { height: 4px; flex: 1; background: #e5e5ea; border-radius: 999px; transition: var(--transition-smooth); }
        .wizard-dot.active { background: var(--text-dark); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-weight: 500; font-size: 0.85rem; color: var(--text-muted); transition: color 0.3s;}
        input[type="text"], input[type="number"], select, textarea, input[type="password"] { width: 100%; padding: 0.85rem; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.95rem; outline: none; transition: var(--transition-smooth); background: #fbfbfd; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-red); background: white; box-shadow: 0 0 0 3px rgba(217,48,37,0.1); }

        .alts-vertical { display: flex; flex-direction: column; gap: 0.6rem; background: #fbfbfd; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color); }
        .alt-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; background: white; cursor: pointer; transition: var(--transition-smooth); }
        .alt-row:has(input:checked) { border-color: var(--success); box-shadow: 0 0 0 1px var(--success);}
        .alt-row input[type="radio"] { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: var(--success); margin: 0; flex-shrink: 0; }
        .alt-label { font-weight: 600; color: var(--text-muted); width: 1.5rem; font-size: 1rem; text-align: center; }
        .alt-row:has(input:checked) .alt-label { color: var(--success); }
